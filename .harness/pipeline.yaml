pipeline:
  name: elixir-thin-client
  identifier: elixirthinclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: elixir-thin-client
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Erlang and Elixir
                  identifier: Install_Erlang_and_Elixir
                  spec:
                    shell: Bash
                    command: |-
                      curl https://mise.run | sh
                      export PATH="$HOME/.local/bin:$PATH"
                      mise use --global erlang@<+matrix.otpVersion>
                      eval "$(mise activate bash)"
                      mise use --global elixir@<+matrix.elixirVersion>
                      erl -eval 'erlang:display(erlang:system_info(otp_release)), halt().' -noshell
                      elixir --version
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      mix local.hex --force
                      mix local.rebar --force
                      mix deps.unlock --all
                      mix deps.get
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      mix test
              - step:
                  type: Run
                  name: Check Formatting
                  identifier: Check_Formatting
                  when:
                    stageStatus: Success
                    condition: <+matrix.elixirVersion> == "1.19.4"
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      mix format --check-formatted
              - step:
                  type: Run
                  name: Run Dialyzer
                  identifier: Run_Dialyzer
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      mix dialyzer --format github
              - step:
                  type: Run
                  name: SonarQube Scan
                  identifier: SonarQube_Scan
                  when:
                    stageStatus: Success
                    condition: <+matrix.elixirVersion> == "1.19.4"
                  spec:
                    shell: Sh
                    command: |-
                      export SONAR_SCANNER_VERSION=5.0.1.3006
                      curl -sSLo sonar-scanner.zip \
                        "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip"
                      unzip -q sonar-scanner.zip
                      export PATH="$PWD/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin:$PATH"
                      apt-get install -y openjdk-17-jdk -qq
                      sonar-scanner \
                        -Dsonar.projectKey=elixir-thin-client \
                        -Dsonar.sources=lib \
                        -Dsonar.tests=test \
                        -Dsonar.host.url=https://sonar.harness.io \
                        -Dsonar.token=<+secrets.getValue("sonarqube-token")> \
                        -Dsonar.exclusions="**/_build/**,**/deps/**" \
                        -Dsonar.coverage.exclusions="test/**"
              - step:
                  type: Run
                  name: Post Quality Gate
                  identifier: Post_Quality_Gate
                  when:
                    stageStatus: Success
                    condition: <+matrix.elixirVersion> == "1.19.4"
                  spec:
                    shell: Bash
                    command: |-
                      #!/bin/bash
                      set -e

                      SONAR_TOKEN="<+secrets.getValue("sonarqube-token")>"
                      SONAR_URL="https://sonar.harness.io"
                      SONAR_PROJECT_KEY="elixir-thin-client"
                      GITHUB_TOKEN="<+secrets.getValue("github-devops-token")>"
                      GITHUB_REPO="elixir-thin-client"
                      COMMIT_SHA="<+codebase.commitSha>"

                      STATUS_JSON=$(curl -sf \
                        -H "Authorization: Bearer ${SONAR_TOKEN}" \
                        "${SONAR_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")

                      QG_STATUS=$(echo "$STATUS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])")

                      case "$QG_STATUS" in
                        OK)    GH_STATE="success"; DESCRIPTION="Quality gate passed" ;;
                        ERROR) GH_STATE="failure"; DESCRIPTION="Quality gate failed" ;;
                        WARN)  GH_STATE="success"; DESCRIPTION="Quality gate passed with warnings" ;;
                        *)     GH_STATE="pending"; DESCRIPTION="Quality gate status unknown" ;;
                      esac

                      TARGET_URL="${SONAR_URL}/dashboard?id=${SONAR_PROJECT_KEY}"

                      curl -sf -X POST \
                        -H "Authorization: token ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        -H "Content-Type: application/json" \
                        -d "{\"state\":\"${GH_STATE}\",\"description\":\"${DESCRIPTION}\",\"context\":\"sonarqube/quality-gate\",\"target_url\":\"${TARGET_URL}\"}" \
                        "https://api.github.com/repos/splitio/${GITHUB_REPO}/statuses/${COMMIT_SHA}"

                      echo "Posted SonarQube quality gate status: ${GH_STATE}"
        strategy:
          matrix:
            elixirVersion:
              - "1.14.0"
              - "1.19.4"
            otpVersion:
              - "25"
              - "28"
            exclude:
              - elixirVersion: "1.14.0"
                otpVersion: "28"
              - elixirVersion: "1.19.4"
                otpVersion: "25"
